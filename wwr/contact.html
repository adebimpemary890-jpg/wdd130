<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Rapids Adventure for rafting reservations, questions, and information about our white water rafting adventures.">
    <meta name="author" content="Mary Adebimpe">

    <title>Contact Us | Rapids Adventure</title>

    <link rel="stylesheet" href="rafting.css">
</head>

<body>

    <header>
        <img src="logo.jpg" alt="Rapids Adventure logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="contact-info">

            <div class="company-info">
                <h2>Rapids Adventure</h2>

                <p>123 River Road</p>
                <p>Adventure City, UT 84000</p>
                <p>Phone: (555) 123-4567</p>
                <p>Email: info@rapidsadventure.com</p>
            </div>

            <div class="map">
                <iframe
                    src="https://www.google.com/maps?q=Salt+Lake+City,+Utah&output=embed"
                    width="300"
                    height="200"
                    title="Map showing the location of Rapids Adventure">
                </iframe>
            </div>

        </section>


        <section class="employees">

            <h2>Meet Our Team</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="rafting1.jpg" alt="Rapids Adventure guide">
                    <figcaption>John Smith - Lead Adventure Guide</figcaption>
                </figure>

                <figure>
                    <img src="rafting2.jpg" alt="Rapids Adventure employee">
                    <figcaption>Sarah Johnson - Reservation Manager</figcaption>
                </figure>

                <figure>
                    <img src="rafting3.jpg" alt="Rapids Adventure employee">
                    <figcaption>Michael Brown - Safety Coordinator</figcaption>
                </figure>

            </div>

        </section>


        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form>

                <fieldset>

                    <legend>Contact Information</legend>

                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required>

                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>

                </fieldset>


                <fieldset>

                    <legend>Purpose of Your Message</legend>

                    <label>
                        <input
                            type="radio"
                            name="purpose"
                            value="general"
                            required>
                        General Inquiry
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="purpose"
                            value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="purpose"
                            value="suggestion">
                        Website Suggestion
                    </label>

                </fieldset>


                <fieldset>

                    <legend>Your Message</legend>

                    <label for="message">Message:</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required></textarea>

                </fieldset>


                <label class="newsletter">
                    <input
                        type="checkbox"
                        name="newsletter"
                        value="yes">
                    Please subscribe me to the monthly newsletter
                </label>


                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 Rapids Adventure | Mary Adebimpe</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="facebook.svg" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="linkedin.svg" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="instagram.svg" alt="Instagram Icon">
            </a>

        </nav>

    </footer>

</body>
</html>
